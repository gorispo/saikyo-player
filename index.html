.lb{text-align:center;color:var(--sub);font-size:11px;letter-spacing:.25em}
.title{text-align:center;font-weight:800;margin:6px 0;color:var(--gd)}
h3{margin:0 0 8px;font-size:12px;letter-spacing:.2em;color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 4px;border-bottom:1px solid var(--bd)}td:last-child{text-align:right;font-weight:700}
.big{font-size:24px;font-weight:900;text-align:center;color:var(--gd)}
